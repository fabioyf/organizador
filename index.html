<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizador Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #09090b; color: #f4f4f5; -webkit-tap-highlight-color: transparent; }
        .tab-active { background-color: #27272a; border-bottom: 2px solid #3b82f6; }
        .selected-acc { border: 2px solid #10b981 !important; background-color: #064e3b44 !important; }
        .note-done { border: 2px solid #10b981 !important; background-color: #064e3b22 !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input[type="number"]::-webkit-inner-spin-button { display: none; }
        input[type="datetime-local"]::-webkit-calendar-picker-indicator { filter: invert(1); }
        
        /* Estilo para a tag de tempo */
        .timer-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 11px;
            margin-top: 8px;
            border: 1px solid rgba(168, 85, 247, 0.2);
            background: rgba(168, 85, 247, 0.1);
            color: #a855f7;
        }
        .timer-expired {
            border-color: rgba(239, 68, 68, 0.3);
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            font-weight: bold;
        }
    </style>
</head>
<body class="p-4 font-sans select-none">
    <div class="max-w-md mx-auto mb-10">
        
        <!-- MENU TABS -->
        <div class="flex gap-2 mb-6 bg-zinc-900 p-1 rounded-2xl shadow-lg border border-zinc-800">
            <button onclick="switchTab('subs')" id="btn-subs" class="flex-1 py-3 rounded-xl text-xs flex items-center justify-center gap-2 transition-all tab-active">
                <i data-lucide="clock" class="w-4"></i> Assinaturas
            </button>
            <button onclick="switchTab('bet')" id="btn-bet" class="flex-1 py-3 rounded-xl text-xs flex items-center justify-center gap-2 transition-all opacity-50">
                <i data-lucide="target" class="w-4"></i> Rollover
            </button>
            <button onclick="switchTab('notes')" id="btn-notes" class="flex-1 py-3 rounded-xl text-xs flex items-center justify-center gap-2 transition-all opacity-50">
                <i data-lucide="clipboard-list" class="w-4"></i> Notas
            </button>
        </div>

        <!-- TAB: ASSINATURAS -->
        <div id="tab-subs" class="space-y-4">
            <div class="bg-zinc-900 p-5 rounded-3xl border border-zinc-800 shadow-xl">
                <h2 class="text-xs font-bold uppercase mb-4 opacity-50 tracking-tighter">Novo Registro</h2>
                <input id="sub-name" placeholder="Ex: Netflix" class="w-full bg-zinc-800 p-4 rounded-2xl mb-2 outline-none focus:ring-2 ring-blue-500 transition-all">
                <div class="flex gap-2">
                    <input id="sub-days" type="number" placeholder="Dias" class="flex-1 bg-zinc-800 p-4 rounded-2xl outline-none focus:ring-2 ring-blue-500">
                    <button onclick="addSubscription()" class="bg-blue-600 hover:bg-blue-500 p-4 rounded-2xl transition-all active:scale-95">
                        <i data-lucide="plus"></i>
                    </button>
                </div>
            </div>
            <div id="subs-list" class="space-y-3"></div>
        </div>

        <!-- TAB: ROLLOVER -->
        <div id="tab-bet" class="hidden space-y-4">
            <div class="bg-zinc-900 p-5 rounded-3xl border border-zinc-800 shadow-xl">
                <h2 class="text-xs font-bold uppercase mb-4 opacity-50 tracking-tighter">Gerenciar Contas</h2>
                <div class="space-y-2">
                    <input id="acc-name" placeholder="Nome da Conta" class="w-full bg-zinc-800 p-4 rounded-2xl outline-none focus:ring-2 ring-emerald-500">
                    <div class="flex gap-2">
                        <input id="acc-goal" type="number" placeholder="Valor Meta" class="flex-1 bg-zinc-800 p-4 rounded-2xl outline-none focus:ring-2 ring-emerald-500">
                        <button onclick="addAccount()" class="bg-emerald-600 hover:bg-emerald-500 p-4 rounded-2xl transition-all active:scale-95">
                            <i data-lucide="user-plus"></i>
                        </button>
                    </div>
                </div>
            </div>
            <div id="acc-list" class="flex gap-3 overflow-x-auto pb-4 no-scrollbar pt-2"></div>
            <div id="action-panel" class="bg-zinc-900 p-6 rounded-[2.5rem] border border-zinc-800 text-center shadow-2xl relative overflow-hidden">
                <div id="panel-empty" class="py-10 opacity-30 italic text-sm">Selecione uma conta</div>
                <div id="panel-content" class="hidden">
                    <div class="mb-4">
                        <h3 id="active-acc-name" class="text-emerald-500 font-bold uppercase text-xs tracking-widest"></h3>
                        <div id="rollover-val" class="text-5xl font-black mt-2 text-zinc-100">R$ 0.00</div>
                        <div id="goal-info" class="text-sm opacity-40 mt-1 font-medium"></div>
                    </div>
                    <div class="w-full bg-zinc-800 h-4 rounded-full mb-6 p-1 border border-zinc-700">
                        <div id="progress-bar" class="h-full bg-emerald-500 rounded-full transition-all duration-700" style="width: 0%"></div>
                    </div>
                    <div id="status-badge" class="hidden mb-6 p-3 rounded-2xl bg-emerald-500/10 border border-emerald-500/50 text-emerald-400 font-black text-sm">🎯 ROLLOVER BATIDO!</div>
                    <input id="bet-input" type="number" placeholder="Valor da entrada" class="w-full bg-zinc-800 p-5 rounded-2xl mb-4 text-center text-3xl font-bold outline-none border-2 border-transparent focus:border-emerald-500">
                    <button onclick="addToRollover()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-5 rounded-2xl font-black text-xl shadow-lg active:scale-95 transition-all">ADICIONAR</button>
                    <div class="flex gap-2 mt-6">
                        <button onclick="addMoreGoal()" class="flex-1 bg-zinc-800 py-3 rounded-xl text-[10px] font-bold uppercase opacity-60">Novo Depósito</button>
                        <button onclick="deleteAccount()" class="flex-1 bg-red-900/10 py-3 rounded-xl text-[10px] font-bold uppercase text-red-500">Excluir</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- TAB: ANOTAÇÕES -->
        <div id="tab-notes" class="hidden space-y-4">
            <div class="bg-zinc-900 p-5 rounded-3xl border border-zinc-800 shadow-xl">
                <h2 class="text-xs font-bold uppercase mb-4 opacity-50 tracking-tighter">Nova Anotação</h2>
                <textarea id="note-text" placeholder="O que você precisa lembrar?" class="w-full bg-zinc-800 p-4 rounded-2xl mb-2 outline-none focus:ring-2 ring-purple-500 transition-all resize-none h-24 text-sm"></textarea>
                <div class="flex gap-2">
                    <input id="note-date" type="datetime-local" class="flex-1 bg-zinc-800 p-4 rounded-2xl outline-none focus:ring-2 ring-purple-500 text-xs">
                    <button onclick="addNote()" class="bg-purple-600 hover:bg-purple-500 p-4 rounded-2xl transition-all active:scale-95">
                        <i data-lucide="save"></i>
                    </button>
                </div>
            </div>
            <div id="notes-list" class="space-y-3"></div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, set, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC3QY0Qy6LBbMi3rxNZ-webjvGrcNwVn-Y",
            authDomain: "organizador-cc1f4.firebaseapp.com",
            databaseURL: "https://organizador-cc1f4-default-rtdb.firebaseio.com",
            projectId: "organizador-cc1f4",
            storageBucket: "organizador-cc1f4.firebasestorage.app",
            messagingSenderId: "787865519615",
            appId: "1:787865519615:web:6e612e336df1058f7093ca",
            measurementId: "G-QPWYX7CL3K"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        let subs = [];
        let accounts = [];
        let notes = [];
        let selectedAccId = null;

        // --- TABS ---
        window.switchTab = (tab) => {
            ['subs', 'bet', 'notes'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.toggle('hidden', t !== tab);
                document.getElementById(`btn-${t}`).classList.toggle('tab-active', t === tab);
                document.getElementById(`btn-${t}`).classList.toggle('opacity-50', t !== tab);
            });
            lucide.createIcons();
        };

        // --- ASSINATURAS ---
        onValue(ref(db, 'assinaturas'), (snapshot) => {
            const data = snapshot.val();
            subs = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : [];
            renderSubs();
        });

        window.addSubscription = () => {
            const name = document.getElementById('sub-name').value;
            const days = document.getElementById('sub-days').value;
            if(!name || !days) return;
            push(ref(db, 'assinaturas'), { name, expiry: Date.now() + (parseInt(days) * 86400000) });
            document.getElementById('sub-name').value = ''; document.getElementById('sub-days').value = '';
        };

        function renderSubs() {
            const list = document.getElementById('subs-list');
            list.innerHTML = '';
            subs.forEach(sub => {
                const card = document.createElement('div');
                card.className = "bg-zinc-900 p-5 rounded-3xl border border-zinc-800 flex justify-between items-center";
                card.innerHTML = `
                    <div>
                        <h3 class="font-bold text-sm text-zinc-300">${sub.name}</h3>
                        <p class="text-xs font-mono text-blue-400 mt-1" id="sub-timer-${sub.id}">Calculando...</p>
                    </div>
                    <button onclick="removeSub('${sub.id}')" class="text-zinc-600 hover:text-red-500 transition-colors"><i data-lucide="trash-2" class="w-5"></i></button>
                `;
                list.appendChild(card);
                startUniversalTimer(sub.expiry, `sub-timer-${sub.id}`);
            });
            lucide.createIcons();
        }
        window.removeSub = (id) => { if(confirm("Excluir assinatura?")) remove(ref(db, `assinaturas/${id}`)); };

        // --- ROLLOVER ---
        onValue(ref(db, 'contas'), (snapshot) => {
            const data = snapshot.val();
            accounts = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : [];
            renderAccounts();
            if (selectedAccId) updatePanel();
        });

        window.addAccount = () => {
            const name = document.getElementById('acc-name').value;
            const goal = parseFloat(document.getElementById('acc-goal').value);
            if(!name || isNaN(goal)) return;
            push(ref(db, 'contas'), { name, current: 0, goal });
            document.getElementById('acc-name').value = ''; document.getElementById('acc-goal').value = '';
        };

        window.selectAccount = (id) => {
            selectedAccId = id;
            document.getElementById('panel-empty').classList.add('hidden');
            document.getElementById('panel-content').classList.remove('hidden');
            updatePanel(); renderAccounts();
        };

        window.updatePanel = () => {
            const acc = accounts.find(a => a.id === selectedAccId);
            if(!acc) return;
            document.getElementById('active-acc-name').innerText = acc.name;
            document.getElementById('rollover-val').innerText = `R$ ${acc.current.toFixed(2)}`;
            document.getElementById('goal-info').innerText = `Meta: R$ ${acc.goal.toFixed(2)}`;
            const prog = Math.min((acc.current / acc.goal) * 100, 100);
            document.getElementById('progress-bar').style.width = `${prog}%`;
            document.getElementById('status-badge').classList.toggle('hidden', acc.current < acc.goal);
        };

        window.addToRollover = () => {
            const val = parseFloat(document.getElementById('bet-input').value || 0);
            if(val <= 0 || !selectedAccId) return;
            const acc = accounts.find(a => a.id === selectedAccId);
            update(ref(db, `contas/${selectedAccId}`), { current: (acc.current || 0) + val });
            document.getElementById('bet-input').value = '';
        };

        window.addMoreGoal = () => {
            const extra = parseFloat(prompt("Valor do novo depósito:"));
            if(isNaN(extra) || extra <= 0) return;
            const acc = accounts.find(a => a.id === selectedAccId);
            update(ref(db, `contas/${selectedAccId}`), { goal: acc.goal + extra });
        };

        window.deleteAccount = () => { if(confirm("Excluir conta?")) { remove(ref(db, `contas/${selectedAccId}`)); selectedAccId = null; } };

        function renderAccounts() {
            const list = document.getElementById('acc-list');
            list.innerHTML = '';
            accounts.forEach(acc => {
                const card = document.createElement('div');
                card.onclick = () => window.selectAccount(acc.id);
                card.className = `min-w-[130px] p-4 rounded-2xl border-2 border-zinc-800 bg-zinc-900 cursor-pointer ${selectedAccId === acc.id ? 'selected-acc' : ''}`;
                card.innerHTML = `<div class="text-[10px] font-bold opacity-40 truncate">${acc.name}</div>
                                  <div class="text-lg font-black">${acc.current >= acc.goal ? 'BATIDO' : 'R$ '+acc.current.toFixed(0)}</div>`;
                list.appendChild(card);
            });
        }

        // --- ANOTAÇÕES (FIXED) ---
        onValue(ref(db, 'anotacoes'), (snapshot) => {
            const data = snapshot.val();
            notes = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : [];
            renderNotes();
        });

        window.addNote = () => {
            const text = document.getElementById('note-text').value;
            const dateStr = document.getElementById('note-date').value;
            if(!text) return;
            
            push(ref(db, 'anotacoes'), { 
                text, 
                deadline: dateStr ? new Date(dateStr).getTime() : null,
                done: false,
                createdAt: Date.now()
            });
            document.getElementById('note-text').value = '';
            document.getElementById('note-date').value = '';
        };

        window.toggleNote = (id, status) => update(ref(db, `anotacoes/${id}`), { done: !status });
        window.deleteNote = (id) => { if(confirm("Excluir anotação?")) remove(ref(db, `anotacoes/${id}`)); };

        function renderNotes() {
            const list = document.getElementById('notes-list');
            list.innerHTML = '';
            notes.sort((a,b) => b.createdAt - a.createdAt).forEach(note => {
                const card = document.createElement('div');
                card.className = `p-5 rounded-3xl border border-zinc-800 transition-all ${note.done ? 'note-done opacity-60' : 'bg-zinc-900'}`;
                
                const timerId = `note-timer-${note.id}`;
                card.innerHTML = `
                    <div class="flex justify-between items-start gap-4">
                        <div class="flex-1">
                            <p class="text-sm font-medium ${note.done ? 'line-through text-emerald-400' : 'text-zinc-200'}">${note.text}</p>
                            
                            <!-- DIV DO CRONÔMETRO -->
                            <div id="${timerId}" class="timer-badge ${note.done ? 'hidden' : ''}">
                                <i data-lucide="clock" class="w-3"></i>
                                <span>${note.deadline ? 'Calculando...' : 'Sem prazo'}</span>
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="toggleNote('${note.id}', ${note.done})" class="p-2 rounded-xl ${note.done ? 'bg-emerald-600' : 'bg-zinc-800'} text-white active:scale-90 transition-all">
                                <i data-lucide="${note.done ? 'check-circle' : 'circle'}" class="w-5"></i>
                            </button>
                            <button onclick="deleteNote('${note.id}')" class="p-2 text-zinc-600 hover:text-red-500 active:scale-90 transition-all">
                                <i data-lucide="trash-2" class="w-5"></i>
                            </button>
                        </div>
                    </div>
                `;
                list.appendChild(card);
                if(note.deadline && !note.done) {
                    startUniversalTimer(note.deadline, timerId, true);
                }
            });
            lucide.createIcons();
        }

        // --- TIMER UNIVERSAL (CORRIGIDO) ---
        function startUniversalTimer(targetTimestamp, elementId, isNote = false) {
            const updateUI = () => {
                const el = document.getElementById(elementId);
                if(!el) return;

                const diff = targetTimestamp - Date.now();
                const span = el.querySelector('span') || el;

                if(diff <= 0) {
                    span.innerText = isNote ? "⚠️ ATRASADO" : "EXPIRADA";
                    if(isNote) el.classList.add('timer-expired');
                    return;
                }

                const d = Math.floor(diff / 86400000);
                const h = Math.floor((diff % 86400000) / 3600000);
                const m = Math.floor((diff % 3600000) / 60000);
                const s = Math.floor((diff % 60000) / 1000);

                span.innerText = `${d}d ${h}h ${m}m ${s}s`;
            };

            updateUI();
            const interval = setInterval(() => {
                if(!document.getElementById(elementId)) {
                    clearInterval(interval);
                    return;
                }
                updateUI();
            }, 1000);
        }

        lucide.createIcons();
    </script>
</body>
</html>
