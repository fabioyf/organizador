<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizador Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #09090b; color: #f4f4f5; -webkit-tap-highlight-color: transparent; }
        .tab-active { background-color: #27272a; border-bottom: 2px solid #3b82f6; }
        .selected-acc { border: 2px solid #10b981 !important; background-color: #064e3b44 !important; }
        .note-done { border: 2px solid #10b981 !important; background-color: #064e3b44 !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input[type="number"]::-webkit-inner-spin-button { display: none; }
        input[type="datetime-local"]::-webkit-calendar-picker-indicator { filter: invert(1); }
    </style>
</head>
<body class="p-4 font-sans select-none">
    <div class="max-w-md mx-auto mb-10">
        
        <!-- MENU TABS -->
        <div class="flex gap-2 mb-6 bg-zinc-900 p-1 rounded-2xl shadow-lg border border-zinc-800">
            <button onclick="switchTab('subs')" id="btn-subs" class="flex-1 py-3 rounded-xl text-xs flex items-center justify-center gap-2 transition-all tab-active">
                <i data-lucide="clock" class="w-4"></i> Assinaturas
            </button>
            <button onclick="switchTab('bet')" id="btn-bet" class="flex-1 py-3 rounded-xl text-xs flex items-center justify-center gap-2 transition-all opacity-50">
                <i data-lucide="target" class="w-4"></i> Rollover
            </button>
            <button onclick="switchTab('notes')" id="btn-notes" class="flex-1 py-3 rounded-xl text-xs flex items-center justify-center gap-2 transition-all opacity-50">
                <i data-lucide="clipboard-list" class="w-4"></i> Notas
            </button>
        </div>

        <!-- TAB: ASSINATURAS (Original) -->
        <div id="tab-subs" class="space-y-4">
            <div class="bg-zinc-900 p-5 rounded-3xl border border-zinc-800 shadow-xl">
                <h2 class="text-xs font-bold uppercase mb-4 opacity-50 tracking-tighter">Novo Registro</h2>
                <input id="sub-name" placeholder="Ex: PC Gamer Nuvem" class="w-full bg-zinc-800 p-4 rounded-2xl mb-2 outline-none focus:ring-2 ring-blue-500 transition-all">
                <div class="flex gap-2">
                    <input id="sub-days" type="number" placeholder="Dias" class="flex-1 bg-zinc-800 p-4 rounded-2xl outline-none focus:ring-2 ring-blue-500">
                    <button onclick="addSubscription()" class="bg-blue-600 hover:bg-blue-500 p-4 rounded-2xl transition-all active:scale-95">
                        <i data-lucide="plus"></i>
                    </button>
                </div>
            </div>
            <div id="subs-list" class="space-y-3"></div>
        </div>

        <!-- TAB: ROLLOVER (Original) -->
        <div id="tab-bet" class="hidden space-y-4">
            <div class="bg-zinc-900 p-5 rounded-3xl border border-zinc-800 shadow-xl">
                <h2 class="text-xs font-bold uppercase mb-4 opacity-50 tracking-tighter">Gerenciar Contas</h2>
                <div class="space-y-2">
                    <input id="acc-name" placeholder="Nome da Conta" class="w-full bg-zinc-800 p-4 rounded-2xl outline-none focus:ring-2 ring-emerald-500">
                    <div class="flex gap-2">
                        <input id="acc-goal" type="number" placeholder="Valor Depósito (Meta)" class="flex-1 bg-zinc-800 p-4 rounded-2xl outline-none focus:ring-2 ring-emerald-500">
                        <button onclick="addAccount()" class="bg-emerald-600 hover:bg-emerald-500 p-4 rounded-2xl transition-all active:scale-95">
                            <i data-lucide="user-plus"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div id="acc-list" class="flex gap-3 overflow-x-auto pb-4 no-scrollbar pt-2"></div>

            <div id="action-panel" class="bg-zinc-900 p-6 rounded-[2.5rem] border border-zinc-800 text-center shadow-2xl relative overflow-hidden">
                <div id="panel-empty" class="py-10 opacity-30 italic text-sm">
                    Selecione uma conta acima
                </div>
                
                <div id="panel-content" class="hidden">
                    <div class="mb-4">
                        <h3 id="active-acc-name" class="text-emerald-500 font-bold uppercase text-xs tracking-widest"></h3>
                        <div id="rollover-val" class="text-5xl font-black mt-2 text-zinc-100">R$ 0.00</div>
                        <div id="goal-info" class="text-sm opacity-40 mt-1 font-medium"></div>
                    </div>

                    <div class="w-full bg-zinc-800 h-4 rounded-full mb-6 p-1 border border-zinc-700">
                        <div id="progress-bar" class="h-full bg-emerald-500 rounded-full transition-all duration-700" style="width: 0%"></div>
                    </div>

                    <div id="status-badge" class="hidden mb-6 p-3 rounded-2xl bg-emerald-500/10 border border-emerald-500/50 text-emerald-400 font-black text-sm animate-pulse">
                        🎯 ROLLOVER BATIDO!
                    </div>

                    <div class="relative group">
                        <input id="bet-input" type="number" placeholder="Valor da entrada" class="w-full bg-zinc-800 p-5 rounded-2xl mb-4 text-center text-3xl font-bold outline-none border-2 border-transparent focus:border-emerald-500 transition-all">
                    </div>
                    
                    <button onclick="addToRollover()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-5 rounded-2xl font-black text-xl shadow-lg active:scale-[0.98] transition-all">
                        ADICIONAR
                    </button>

                    <div class="flex gap-2 mt-6">
                        <button onclick="addMoreGoal()" class="flex-1 bg-zinc-800 hover:bg-zinc-700 py-3 rounded-xl text-[10px] font-bold uppercase opacity-60">Novo Depósito</button>
                        <button onclick="deleteAccount()" class="flex-1 bg-red-900/10 hover:bg-red-900/20 py-3 rounded-xl text-[10px] font-bold uppercase text-red-500">Excluir Conta</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- NOVA TAB: ANOTAÇÕES (Nova) -->
        <div id="tab-notes" class="hidden space-y-4">
            <div class="bg-zinc-900 p-5 rounded-3xl border border-zinc-800 shadow-xl">
                <h2 class="text-xs font-bold uppercase mb-4 opacity-50 tracking-tighter">Nova Anotação</h2>
                <textarea id="note-text" placeholder="O que precisa ser feito?" class="w-full bg-zinc-800 p-4 rounded-2xl mb-2 outline-none focus:ring-2 ring-purple-500 transition-all resize-none h-24 text-sm"></textarea>
                <div class="flex gap-2">
                    <input id="note-date" type="datetime-local" class="flex-1 bg-zinc-800 p-4 rounded-2xl outline-none focus:ring-2 ring-purple-500 text-xs">
                    <button onclick="addNote()" class="bg-purple-600 hover:bg-purple-500 p-4 rounded-2xl transition-all active:scale-95">
                        <i data-lucide="sticky-note"></i>
                    </button>
                </div>
            </div>
            <div id="notes-list" class="space-y-3"></div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, set, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC3QY0Qy6LBbMi3rxNZ-webjvGrcNwVn-Y",
            authDomain: "organizador-cc1f4.firebaseapp.com",
            databaseURL: "https://organizador-cc1f4-default-rtdb.firebaseio.com",
            projectId: "organizador-cc1f4",
            storageBucket: "organizador-cc1f4.firebasestorage.app",
            messagingSenderId: "787865519615",
            appId: "1:787865519615:web:6e612e336df1058f7093ca",
            measurementId: "G-QPWYX7CL3K"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        let subs = [];
        let accounts = [];
        let notes = [];
        let selectedAccId = null;

        // --- TABS ---
        window.switchTab = (tab) => {
            const tabs = ['subs', 'bet', 'notes'];
            tabs.forEach(t => {
                document.getElementById(`tab-${t}`).classList.toggle('hidden', t !== tab);
                document.getElementById(`btn-${t}`).classList.toggle('tab-active', t === tab);
                document.getElementById(`btn-${t}`).classList.toggle('opacity-50', t !== tab);
            });
            lucide.createIcons();
        };

        // --- SUBSCRIPTIONS LOGIC (Original) ---
        onValue(ref(db, 'assinaturas'), (snapshot) => {
            const data = snapshot.val();
            subs = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : [];
            renderSubs();
        });

        window.addSubscription = () => {
            const name = document.getElementById('sub-name').value;
            const days = document.getElementById('sub-days').value;
            if(!name || !days) return;
            const expiry = Date.now() + (parseInt(days) * 24 * 60 * 60 * 1000);
            push(ref(db, 'assinaturas'), { name, expiry });
            document.getElementById('sub-name').value = '';
            document.getElementById('sub-days').value = '';
        };

        window.removeSub = (id) => {
            if(confirm("Remover esta assinatura?")) remove(ref(db, `assinaturas/${id}`));
        };

        function renderSubs() {
            const list = document.getElementById('subs-list');
            list.innerHTML = '';
            subs.forEach(sub => {
                const card = document.createElement('div');
                card.className = "bg-zinc-900 p-5 rounded-3xl border border-zinc-800 flex justify-between items-center shadow-lg";
                card.innerHTML = `
                    <div class="flex-1">
                        <h3 class="font-bold text-zinc-200 text-sm">${sub.name}</h3>
                        <p class="text-xs font-mono text-blue-400 mt-1" id="timer-${sub.id}">Calculando...</p>
                    </div>
                    <button onclick="removeSub('${sub.id}')" class="p-2 text-zinc-600 hover:text-red-500 transition-colors">
                        <i data-lucide="trash-2" class="w-5"></i>
                    </button>
                `;
                list.appendChild(card);
                startSubTimer(sub);
            });
            lucide.createIcons();
        }

        function startSubTimer(sub) {
            const el = document.getElementById(`timer-${sub.id}`);
            const updateTimer = () => {
                if(!el) return;
                const diff = sub.expiry - Date.now();
                if(diff <= 0) {
                    el.innerText = "ASSINATURA EXPIRADA";
                    el.className = "text-xs font-bold text-red-500 mt-1";
                    return;
                }
                const d = Math.floor(diff / 86400000);
                const h = Math.floor((diff / 3600000) % 24);
                const m = Math.floor((diff / 60000) % 60);
                const s = Math.floor((diff / 1000) % 60);
                el.innerText = `${d}d ${h}h ${m}m ${s}s restante`;
            };
            updateTimer();
            setInterval(updateTimer, 1000);
        }

        // --- ACCOUNTS LOGIC (Original) ---
        onValue(ref(db, 'contas'), (snapshot) => {
            const data = snapshot.val();
            accounts = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : [];
            renderAccounts();
            if (selectedAccId) updatePanel();
        });

        window.addAccount = () => {
            const nameInput = document.getElementById('acc-name');
            const goalInput = document.getElementById('acc-goal');
            const name = nameInput.value.trim();
            const goal = parseFloat(goalInput.value);
            if(!name || isNaN(goal)) return alert("Preencha os campos!");
            push(ref(db, 'contas'), { name, current: 0, goal });
            nameInput.value = ''; goalInput.value = '';
        };

        window.selectAccount = (id) => {
            selectedAccId = id;
            document.getElementById('panel-empty').classList.add('hidden');
            document.getElementById('panel-content').classList.remove('hidden');
            updatePanel();
            renderAccounts();
        };

        window.updatePanel = () => {
            const acc = accounts.find(a => a.id === selectedAccId);
            if(!acc) {
                document.getElementById('panel-content').classList.add('hidden');
                document.getElementById('panel-empty').classList.remove('hidden');
                return;
            };
            const progress = Math.min((acc.current / acc.goal) * 100, 100);
            document.getElementById('active-acc-name').innerText = acc.name;
            document.getElementById('rollover-val').innerText = `R$ ${acc.current.toFixed(2)}`;
            document.getElementById('goal-info').innerText = `Depósito/Meta: R$ ${acc.goal.toFixed(2)}`;
            document.getElementById('progress-bar').style.width = `${progress}%`;
            const isDone = acc.current >= acc.goal;
            document.getElementById('status-badge').classList.toggle('hidden', !isDone);
        };

        window.addToRollover = () => {
            const input = document.getElementById('bet-input');
            const val = parseFloat(input.value || 0);
            if(val <= 0 || !selectedAccId) return;
            const acc = accounts.find(a => a.id === selectedAccId);
            update(ref(db, `contas/${selectedAccId}`), { current: (acc.current || 0) + val });
            input.value = '';
        };

        window.addMoreGoal = () => {
            const extra = parseFloat(prompt("Qual o valor do novo depósito?"));
            if(isNaN(extra) || extra <= 0) return;
            const acc = accounts.find(a => a.id === selectedAccId);
            update(ref(db, `contas/${selectedAccId}`), { goal: acc.goal + extra });
        };

        window.deleteAccount = () => {
            if(confirm("Excluir esta conta permanentemente?")) {
                remove(ref(db, `contas/${selectedAccId}`));
                selectedAccId = null;
            }
        };

        function renderAccounts() {
            const list = document.getElementById('acc-list');
            list.innerHTML = '';
            accounts.forEach(acc => {
                const isSelected = selectedAccId === acc.id;
                const isDone = acc.current >= acc.goal;
                const card = document.createElement('div');
                card.onclick = () => window.selectAccount(acc.id);
                card.className = `min-w-[130px] p-4 rounded-2xl border-2 border-zinc-800 bg-zinc-900 cursor-pointer transition-all ${isSelected ? 'selected-acc shadow-lg shadow-emerald-900/10' : ''}`;
                card.innerHTML = `
                    <div class="text-[10px] font-bold uppercase opacity-40 truncate mb-1">${acc.name}</div>
                    <div class="text-lg font-black ${isDone ? 'text-emerald-400' : 'text-zinc-200'}">
                        ${isDone ? 'BATIDO' : 'R$ '+(acc.current || 0).toFixed(0)}
                    </div>
                    <div class="text-[9px] opacity-30">Meta: R$ ${acc.goal}</div>
                `;
                list.appendChild(card);
            });
        }

        // --- NOTES LOGIC (Nova) ---
        onValue(ref(db, 'anotacoes'), (snapshot) => {
            const data = snapshot.val();
            notes = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : [];
            renderNotes();
        });

        window.addNote = () => {
            const text = document.getElementById('note-text').value;
            const date = document.getElementById('note-date').value;
            if(!text) return;
            push(ref(db, 'anotacoes'), { 
                text, 
                deadline: date ? new Date(date).getTime() : null,
                done: false,
                createdAt: Date.now()
            });
            document.getElementById('note-text').value = '';
            document.getElementById('note-date').value = '';
        };

        window.toggleNote = (id, currentStatus) => {
            update(ref(db, `anotacoes/${id}`), { done: !currentStatus });
        };

        window.deleteNote = (id) => {
            if(confirm("Excluir anotação?")) remove(ref(db, `anotacoes/${id}`));
        };

        function renderNotes() {
            const list = document.getElementById('notes-list');
            list.innerHTML = '';
            notes.sort((a, b) => b.createdAt - a.createdAt).forEach(note => {
                const card = document.createElement('div');
                card.className = `p-5 rounded-3xl border border-zinc-800 transition-all shadow-lg ${note.done ? 'note-done' : 'bg-zinc-900'}`;
                
                let timerHtml = '';
                if(note.deadline && !note.done) {
                    timerHtml = `<p class="text-[10px] font-mono mt-2" id="note-timer-${note.id}">Calculando tempo...</p>`;
                }

                card.innerHTML = `
                    <div class="flex justify-between items-start gap-4">
                        <div class="flex-1">
                            <p class="text-sm font-medium ${note.done ? 'text-emerald-100 line-through opacity-50' : 'text-zinc-200'}">${note.text}</p>
                            ${timerHtml}
                        </div>
                        <div class="flex gap-2">
                            <button onclick="toggleNote('${note.id}', ${note.done})" class="p-2 rounded-xl ${note.done ? 'bg-emerald-500 text-white' : 'bg-zinc-800 text-zinc-400'} transition-all">
                                <i data-lucide="${note.done ? 'check-circle-2' : 'circle'}" class="w-5"></i>
                            </button>
                            <button onclick="deleteNote('${note.id}')" class="p-2 text-zinc-600 hover:text-red-500 transition-colors">
                                <i data-lucide="trash-2" class="w-5"></i>
                            </button>
                        </div>
                    </div>
                `;
                list.appendChild(card);
                if(note.deadline && !note.done) startNoteTimer(note);
            });
            lucide.createIcons();
        }

        function startNoteTimer(note) {
            const el = document.getElementById(`note-timer-${note.id}`);
            const updateNoteTimer = () => {
                if(!el) return;
                const diff = note.deadline - Date.now();
                
                if(diff <= 0) {
                    el.innerText = "⚠️ ATRASADO";
                    el.className = "text-[10px] font-black text-red-500 mt-2 animate-pulse";
                    return;
                }

                const d = Math.floor(diff / 86400000);
                const h = Math.floor((diff / 3600000) % 24);
                const m = Math.floor((diff / 60000) % 60);
                const s = Math.floor((diff / 1000) % 60);
                
                el.innerText = `Faltam: ${d}d ${h}h ${m}m ${s}s`;
                el.className = "text-[10px] font-mono text-purple-400 mt-2";
            };
            updateNoteTimer();
            const interval = setInterval(() => {
                if(!document.getElementById(`note-timer-${note.id}`)) clearInterval(interval);
                updateNoteTimer();
            }, 1000);
        }

        // Init icons
        lucide.createIcons();
    </script>
</body>
</html>
